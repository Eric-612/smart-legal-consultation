# ============================================================
# 本机覆盖配置（docker-compose.override.yml，自动与 docker-compose.yml 合并）
# 原因：本机已有 MySQL80 服务占用 3306 端口，故将容器 MySQL 宿主端口映射改为 3307
# 注意：需同步把 .env 的 MYSQL_PORT 改为 3307
# ============================================================
services:
  mysql:
    ports: !override
      - "3307:3306"
